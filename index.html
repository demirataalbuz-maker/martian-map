<!doctype html>
<!-- AI-assisted code: written with Claude (Anthropic) and Antigravity (Google DeepMind), reviewed by the team. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marswalk Map</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Marswalk Map</h1>
      <span id="site-name" class="site"></span>
      <span id="synthetic-badge" class="badge" hidden>SYNTHETIC DATA — not real Mars data</span>
    </header>
    <div class="layout">
    <main class="stage">
      <div id="map" aria-label="Layered map of the traverse area"></div>
      <div id="scalebar" class="scalebar" aria-live="off">
        <div class="scalebar-line"></div>
        <span class="scalebar-label"></span>
      </div>
      <div id="status" class="status" role="status"></div>
    </main>
    <aside class="panel" id="panel">
      <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">Route &amp; layers</button>
      <div id="panel-body" class="panel-body">
        <section id="route-panel" class="route">
          <h2>Route &amp; landing</h2>
          <div id="route-traverser" class="route-traverser"></div>
          <div id="route-mode" class="route-mode" role="group" aria-label="Start mode" hidden>
            <button id="mode-auto" type="button" class="mode-btn active">Recommend landing</button>
            <button id="mode-manual" type="button" class="mode-btn">Manual start</button>
          </div>
          <p id="route-hint" class="route-hint"></p>
          <div class="route-actions">
            <button id="route-undo" type="button" disabled>Undo last point</button>
            <button id="route-clear" type="button" disabled>Clear route</button>
          </div>
          <div class="route-actions">
            <button id="route-download" type="button" disabled>Download route (GeoJSON)</button>
          </div>
          <p id="route-message" class="route-message" role="status" hidden></p>
          <div id="landing-candidates" class="landing-candidates" hidden></div>
          <div id="route-results" class="route-results" hidden></div>
        </section>
        <h2>Layers</h2>
        <div id="layer-list"></div>
      </div>
    </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
