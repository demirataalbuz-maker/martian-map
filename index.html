<!doctype html>
<!-- AI-assisted code: written with Claude (Anthropic), reviewed by the team. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marswalk Map</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Marswalk Map</h1>
      <span id="site-name" class="site"></span>
      <span id="synthetic-badge" class="badge" hidden>SYNTHETIC DATA — not real Mars data</span>
    </header>
    <div class="layout">
    <main class="stage">
      <div id="map" aria-label="Layered map of the traverse area"></div>
      <div id="scalebar" class="scalebar" aria-live="off">
        <div class="scalebar-line"></div>
        <span class="scalebar-label"></span>
      </div>
      <div id="status" class="status" role="status"></div>
    </main>
    <aside class="panel" id="panel">
      <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body">Layers</button>
      <div id="panel-body" class="panel-body">
        <div id="layer-list"></div>
      </div>
    </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
